spring.application.name=toro-forrajero

# Conexión mediante variables de entorno para producción
spring.datasource.url=jdbc:mysql://${PROD_DB_HOST}:3306/${PROD_DB_NAME}
spring.datasource.username=${PROD_DB_USERNAME}
spring.datasource.password=${PROD_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Dialecto y configuración de Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${PROD_DDL}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false
server.port=8080

spring.mvc.pathmatch.matching-strategy=ant_path_matcher

server.servlet.encoding.charset=UTF-8

# Límite para cargas Multipart (Archivos binarios)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Límite para payloads HTTP Post/JSON grandes (Base64)
server.tomcat.max-swallow-size=50MB
server.tomcat.max-http-form-post-size=50MB