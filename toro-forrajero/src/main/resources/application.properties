spring.application.name=toro-forrajero

# Conexión dynamic referenciando el archivo .env
spring.datasource.url=jdbc:mysql://localhost:3306/toro_forrajero_db
spring.datasource.username=chuy_user
spring.datasource.password=torito123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Dialecto y configuración de Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false
server.port=8080

spring.mvc.pathmatch.matching-strategy=ant_path_matcher

server.servlet.encoding.charset=UTF-8

# Límite para cargas Multipart (Archivos binarios)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Límite para payloads HTTP Post/JSON grandes (Base64)
server.tomcat.max-swallow-size=50MB
server.tomcat.max-http-form-post-size=50MB