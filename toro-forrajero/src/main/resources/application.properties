spring.application.name=toro-forrajero

# Conexión directa con parámetros de compatibilidad MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/toro_forrajero_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Forzar dialecto para que no colapse al iniciar
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false
server.port=8080